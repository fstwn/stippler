name: Publish to PyPI

on:
  # Primary chain: runs when the Grasshopper release workflow succeeds.
  workflow_run:
    workflows: ["Grasshopper Folder Release"]
    types: [completed]
    branches: [python39-rhino-port]

  # Also runs when a PAT-authored release fires release:published.
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            version=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
            if [ -z "$version" ]; then
              version=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
            fi
            if [ -z "$version" ]; then
              version=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName -q '.[0].tagName')
            fi
          else
            version="${{ inputs.version }}"
          fi

          if [ -z "$version" ]; then
            echo "Could not determine version."
            exit 1
          fi

          echo "Publishing stippler $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: |
          sed -i 's/^__version__ = .*/__version__ = "${{ steps.version.outputs.version }}"/' src/stippler/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
