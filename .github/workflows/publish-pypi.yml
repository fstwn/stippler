name: Publish to PyPI

on:
  # Runs after the Grasshopper release workflow creates a GitHub Release.
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            version="${tag#gh}"
          else
            version="${{ inputs.version }}"
          fi

          if [ -z "$version" ]; then
            echo "Could not determine version."
            exit 1
          fi

          echo "Publishing stippler $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set package version
        run: |
          sed -i 's/^__version__ = .*/__version__ = "${{ steps.version.outputs.version }}"/' src/stippler/__init__.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
